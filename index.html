<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Conciergerie — MTL connecte 2026</title>

  <style>
    :root {
      --vert: #6fbf4a;
      --vert-fonce: #58a038;
      --texte: #0b0d0c;
      --muted: #667066;
      --fond: #f4f5f4;
      --bordure: #dde0dc;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--fond);
      color: var(--texte);
      font-family: Inter, Arial, sans-serif;
    }

    main {
      width: min(560px, 100%);
      padding: 42px 34px;
      text-align: center;
      background: #fff;
      border: 1px solid var(--bordure);
      border-radius: 16px;
    }

    .mark {
      width: 52px;
      height: 5px;
      margin: 0 auto 26px;
      border-radius: 999px;
      background: var(--vert);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.55rem, 4vw, 2rem);
      line-height: 1.2;
    }

    p {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
    }

    strong {
      color: var(--vert-fonce);
    }
  </style>
</head>

<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>Conciergerie — MTL connecte 2026</h1>
    <p>Accès à la plateforme via votre <strong>lien dédié</strong>.</p>
  </main>
</body>
</html>
